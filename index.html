<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>길드 공략 허브</title>
<script>
/* 카카오톡 안에서 열면(인앱 브라우저) 기본 브라우저로 다시 열어, 카톡 채팅방으로 돌아갈 때 창을 닫지 않아도 되게 함. 한 번만 시도하고 실패하면 아래 버튼을 보여 줌 */
(function(){
  if(!/KAKAOTALK/i.test(navigator.userAgent)) return;
  var u=location.href.split('#')[0], ext='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);
  var tried=false; try{ tried=sessionStorage.getItem('kk_ext')==='1'; sessionStorage.setItem('kk_ext','1'); }catch(e){}
  if(!tried){ location.replace(ext); }
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('a'); b.href=ext; b.textContent='🌐 기본 브라우저로 열기 (카톡 창은 그대로 유지돼요)';
    b.style.cssText='display:block;text-align:center;padding:10px;background:#fff3cd;color:#664d03;font-size:14px;text-decoration:none';
    document.body.insertBefore(b,document.body.firstChild);
  });
})();
</script><link rel="stylesheet" href="style.css?v=11d225f0">
</head><body>
